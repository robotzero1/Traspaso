; /etc/supervisor/conf.d/traspaso.conf — keeps the queue worker running.
; supervisorctl reread && supervisorctl update
[program:traspaso-worker]
command=php /var/www/traspaso/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/var/www/traspaso/storage/logs/worker.log
